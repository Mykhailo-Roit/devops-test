apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nestjs-ingress
  namespace: nestjs-redis-app
  labels:
    app: nestjs-app
    component: ingress
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  rules:
  - host: nestjs-app.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nestjs-service
            port:
              number: 80
  # For production with TLS:
  # tls:
  # - hosts:
  #   - nestjs-app.yourdomain.com
  #   secretName: nestjs-tls-secret
