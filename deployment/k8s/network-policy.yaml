apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nestjs-redis-network-policy
  namespace: nestjs-redis-app
  labels:
    app: nestjs-redis-app
    component: security
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress traffic to NestJS app from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    to:
    - podSelector:
        matchLabels:
          app: nestjs-app
    ports:
    - protocol: TCP
      port: 3000
  # Allow traffic from NestJS to Redis
  - from:
    - podSelector:
        matchLabels:
          app: nestjs-app
    to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  egress:
  # Allow NestJS to connect to Redis
  - from:
    - podSelector:
        matchLabels:
          app: nestjs-app
    to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  # Allow DNS resolution
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
  # Allow outbound HTTPS for package downloads (if needed)
  - to: []
    ports:
    - protocol: TCP
      port: 443
