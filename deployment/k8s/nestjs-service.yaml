apiVersion: v1
kind: Service
metadata:
  name: nestjs-service
  namespace: nestjs-redis-app
  labels:
    app: nestjs-app
    component: backend
spec:
  selector:
    app: nestjs-app
    component: backend
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  type: ClusterIP
